<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Meadow — procedural WebGPU grass</title>
	<meta name="description" content="A procedural, GPU-driven meadow: a million wind-swept grass blades and wildflowers rendered in real time with WebGPU compute shaders." />
	<style>
		html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0d0a; color: #f2efe6; font: 13px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
		canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
		canvas:active { cursor: grabbing; }
		#hud { position: fixed; left: 14px; bottom: 12px; opacity: .55; letter-spacing: .02em; pointer-events: none; text-shadow: 0 1px 2px #0008; font-variant-numeric: tabular-nums; }
		#help { position: fixed; left: 14px; top: 12px; opacity: .6; pointer-events: none; text-shadow: 0 1px 2px #0008; max-width: 60ch; }
		#help b { font-weight: 600; }
		#sound { position: fixed; right: 14px; bottom: 12px; z-index: 4; display: flex; align-items: center; gap: 8px; padding: 7px 12px 7px 10px; border-radius: 999px; border: 1px solid #fff3; background: #0006; color: #f2efe6; font: inherit; letter-spacing: .03em; cursor: pointer; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); opacity: .75; transition: opacity .2s; }
		#sound:hover { opacity: 1; }
		#sound i { display: flex; gap: 2px; align-items: flex-end; height: 12px; }
		#sound i b { width: 2px; height: 3px; background: currentColor; border-radius: 1px; }
		#sound.on i b { animation: eq 1.1s ease-in-out infinite; }
		#sound.on i b:nth-child(2) { animation-delay: -.4s; }
		#sound.on i b:nth-child(3) { animation-delay: -.7s; }
		@keyframes eq { 0%, 100% { height: 3px; } 50% { height: 12px; } }
		#loading { position: fixed; inset: 0; display: grid; place-items: center; background: #0b0d0a; transition: opacity 1.1s ease; z-index: 5; letter-spacing: .3em; text-transform: uppercase; font-size: 11px; }
		#loading.done { opacity: 0; pointer-events: none; }
		#nogpu { position: fixed; inset: 0; display: grid; place-items: center; z-index: 6; background: #0b0d0a; }
		#nogpu[hidden] { display: none; }
		#nogpu p { max-width: 46ch; text-align: center; opacity: .85; padding: 0 24px; }
		@media (hover: none) { #help .desk { display: none; } }
		@media (hover: hover) { #help .touch { display: none; } }
	</style>
</head>
<body>
	<div id="loading">growing the meadow…</div>
	<div id="nogpu" hidden><p></p></div>
	<div id="help">
		<span class="desk"><b>drag</b> look · <b>WASD</b> walk · <b>shift</b> run · <b>wheel / Q E</b> height · <b>M</b> sound</span>
		<span class="touch"><b>drag</b> look · <b>two fingers</b> walk</span>
	</div>
	<div id="hud"></div>
	<button id="sound" type="button" aria-pressed="false" title="Toggle sound (M)"><i><b></b><b></b><b></b></i><span>sound off</span></button>
	<script type="module" src="/src/main.js"></script>
</body>
</html>
